name: Littlehampton Weather Fetcher

on:
  schedule:
    # --- UK-local 05:30 schedule ---
    # BST months (Apr–Oct): 05:30 UK = 04:30 UTC
    - cron: "30 4 * 4-10 *"

    # GMT months (Nov–Mar): 05:30 UK = 05:30 UTC
    - cron: "30 5 * 1-3,11-12 *"

    # --- Every 3 hours (UTC) ---
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install requests
      run: pip install requests

    - name: Fetch Littlehampton weather
      run: |
        python3 << 'EOF'
        import requests, json

        lat = 50.804
        lon = -0.539

        url = (
            "https://api.open-meteo.com/v1/forecast?"
            f"latitude={lat}&longitude={lon}"
            "&current_weather=true"
            "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum"
            "&timezone=Europe/London"
        )

        r = requests.get(url)
        data = r.json()

        with open("weather.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2, ensure_ascii=False)
        EOF

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add weather.json
        git commit -m "Update Littlehampton weather" || echo "No changes"
        git push
